name: Monitor public sources
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-monitor
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/monitor.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-check-report
          path: monitor-report.json
          retention-days: 14
